recipe_version: "2"
model: edougawa/Qwen3.8-Flash-Next-W4A16-PLE4-MTP-Spark
runtime: vllm
container: vllm/vllm-openai:qwen38-flash-next
pull_image: true

metadata:
  description: Qwen3.8

defaults:
  port: 8000
  host: 0.0.0.0
  d_type: bfloat16
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  model_name: qwen3.8

executor_config:
  entrypoint: ""

env:
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"

command: |
   vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size 1 \
    --pipeline-parallel-size 1 \
    --max-num-seqs 1
